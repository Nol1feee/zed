<svg id="architecture-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Общий UI Zed и два отдельных backend-пути: Git и внешний Arc provider</title>
<desc id="architecture-desc">Git Panel использует штатный GitStore и Repository для Git. Для Arc VcsPanel связывает UI с VcsStore. VcsStore вызывает отдельный Python-процесс через framed JSON-RPC поверх stdio. WASM extension задаёт команду его запуска. Python provider вызывает native arc CLI, который работает с mount и store. Git не переносится на внешний протокол.</desc>
<defs><marker id="arc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#737780" stroke-width="1.4"/></marker></defs>
<style>#architecture-diagram text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#252832} #architecture-diagram .small{font-size:16px;fill:#656a76}#architecture-diagram .name{font-size:20px;font-weight:600}#architecture-diagram .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:16px}#architecture-diagram .wire{fill:none;stroke:#737780;stroke-width:1.5;marker-end:url(#arc-arrow)}#architecture-diagram .label{font-size:15px;fill:#656a76}</style>
<rect width="1100" height="700" fill="#fafafa"/>
<rect x="24" y="36" width="1052" height="432" rx="4" fill="#f2f2f5" stroke="#d6d7de"/>
<text x="44" y="64" class="small">Zed · общий UI и отдельные backend-пути</text>
<rect x="24" y="508" width="1052" height="136" rx="4" fill="none" stroke="#c7cad0" stroke-dasharray="5 5"/>
<text x="44" y="532" class="small">За границей процесса Zed</text>
<!-- Connections precede nodes; all routing is orthogonal. -->
<g id="connections">
<path class="wire" d="M468 168 V188 Q468 200 456 200 H202 Q190 200 190 212 V236"/>
<path class="wire" d="M550 168 V236"/>
<path class="wire" d="M550 316 V380"/>
<path class="wire" d="M910 316 V408 Q910 420 898 420 H680"/>
<path class="wire" d="M550 452 V480 Q550 492 538 492 H202 Q190 492 190 504 V552"/>
<path class="wire" d="M320 588 H420"/>
<path class="wire" d="M680 588 H780"/>
</g>
<g id="zed-ui"><rect x="420" y="96" width="260" height="72" rx="4" fill="#fff" stroke="#a8abb5"/><text x="440" y="125" class="name">Git Panel</text><text x="440" y="151" class="small">привычные компоненты Zed</text></g>
<g id="stock-git"><rect x="60" y="236" width="260" height="80" rx="4" fill="#fff" stroke="#a8abb5"/><text x="80" y="267" class="name">Штатный Git</text><text x="80" y="295" class="mono">GitStore / Repository</text><text x="60" y="344" class="small">Свой async путь сохранён.</text><text x="60" y="370" class="small">Внешний API ему не нужен.</text></g>
<g id="external-store"><rect x="420" y="236" width="260" height="80" rx="4" fill="#eeebfa" stroke="#7161ad"/><text x="440" y="267" class="name">Внешний VCS</text><text x="440" y="295" class="mono">VcsPanel → VcsStore</text></g>
<rect x="460" y="336" width="180" height="24" fill="#f2f2f5"/><text x="470" y="354" class="label">typed capabilities</text>
<g id="extension"><rect x="780" y="236" width="260" height="80" rx="4" fill="#fff" stroke="#a8abb5"/><text x="800" y="267" class="name">WASM extension</text><text x="800" y="295" class="small">задаёт команду запуска</text></g>
<rect x="762" y="376" width="200" height="24" fill="#f2f2f5"/><text x="774" y="394" class="label">launch command</text>
<g id="transport"><rect x="420" y="380" width="260" height="72" rx="4" fill="#fff" stroke="#a8abb5"/><text x="440" y="409" class="name">Provider transport</text><text x="440" y="435" class="mono">framed JSON-RPC · stdio</text></g>
<g id="arc-provider"><rect x="60" y="552" width="260" height="72" rx="4" fill="#e8f1eb" stroke="#557d65"/><text x="80" y="581" class="name">Python Arc provider</text><text x="80" y="607" class="small">отдельный локальный процесс</text></g>
<g id="arc-cli"><rect x="420" y="552" width="260" height="72" rx="4" fill="#fff" stroke="#a8abb5"/><text x="440" y="581" class="name">Native arc CLI</text><text x="440" y="607" class="small">реальные команды Arc</text></g>
<g id="arc-storage"><path d="M780 552 H1040 V624 H780 Z M780 564 H1040" fill="#fff" stroke="#a8abb5"/><text x="800" y="588" class="name">Arc mount / store</text><text x="800" y="613" class="small">checkout и его состояние</text></g>
<text x="44" y="680" class="small">Универсальный внешний контракт; локально реализован Arc. VCS не использует Git CLI shim.</text>
</svg>